<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        /* 1. HTML / BODY 스크롤 스냅 설정 */
        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        body { 
            margin: 0; 
            padding: 0; 
            padding-top: 100px; 
            background-color: #ffffff; 
            font-family: 'Pretendard', sans-serif; 
            font-size: 12px; 
            color: #333; 
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* 인트로 배경 오버레이 */
        #introOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9998;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        /* 인트로 그라데이션 선 */
        .intro-line {
            position: fixed;
            top: 50vh;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(
                to right, 
                rgba(160, 160, 160, 0) 0%, 
                rgba(160, 160, 160, 0.5) 2%, 
                rgba(100, 100, 100, 1) 15%, 
                rgba(100, 100, 100, 1) 85%, 
                rgba(160, 160, 160, 0.5) 98%, 
                rgba(160, 160, 160, 0) 100%
            );
            transform: scaleX(0);
            transform-origin: center;
            z-index: 10001;
            animation: expandLine 1.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transition: top 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: none;
        }

        @keyframes expandLine {
            0% { transform: scaleX(0); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: scaleX(1); opacity: 1; }
        }

        /* 본문 및 헤더 요소 초기 숨김 */
        .header, .main-wrapper {
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        body.loaded .header, 
        body.loaded .main-wrapper {
            opacity: 1;
        }

        body.loaded {
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .intro-line {
                left: 15px;
                right: 15px;
                height: 0.8px;
            }
        }

        a { text-decoration: none; color: inherit; display: block; }

        .header { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 35px; 
            padding: 20px 60px 25px 60px; 
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%;
            background-color: #ffffff; 
            z-index: 1000; 
            font-weight: 500;
            box-sizing: border-box;
            border-bottom: none; 
            align-items: center; 
        }

        .sub-text { font-weight: 300; } 
        
        .header-left { 
            display: grid; 
            grid-template-columns: auto 1fr; 
            align-items: center; 
        }
        .header-left > div:last-child {
            justify-self: center;
        }

        .header-right { display: grid; grid-template-columns: 1fr 1fr; align-items: start; position: relative; }

        .center-text {
            font-size: 12px;
            font-weight: 300;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .logo-area { display: flex; align-items: center; }
        .logo-text { font-size: 42px; font-weight: 600; letter-spacing: 1px; line-height: 1; }

        /* 메뉴 Wrapper */
        .menu-wrapper {
            position: absolute;
            right: 0px;
            top: 2.5px;
            z-index: 1000;
        }

        .menu-btn { 
            width: 25px; 
            height: 22px; 
            cursor: pointer; 
            margin-left: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px;
            box-sizing: border-box;
            transition: transform 0.3s ease; 
        }

        .menu-btn span {
            display: block;
            width: 100%;
            height: 1.5px;
            background-color: #000;
            transition: background-color 0.3s ease;
        }

        .menu-list { 
            display: block; 
            position: absolute; 
            top: 30px; 
            right: 0; 
            background: #ffffff; 
            border: 1px solid #333; 
            padding: 10px; 
            text-align: right; 
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .menu-wrapper:hover .menu-list,
        .menu-wrapper.active .menu-list { 
            opacity: 1;
            visibility: visible;
        }

        .menu-list div { padding: 5px 0; cursor: pointer; }
        .menu-list div:hover { text-decoration: underline; }

        /* 전체 레이아웃 (좌: 이미지 스크롤, 우: 고정 텍스트) */
        .main-wrapper { 
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
            padding: 0 60px 20px 60px; 
            margin-top: 50px;
            box-sizing: border-box;
        }

        /* 왼쪽 이미지 스크롤 영역 */
        .image-scroll-section {
            display: flex;
            flex-direction: column;
        }

        /* 2. 상단 수평 정렬을 위한 스냅 옵션 수정 */
        .image-snap-item {
            margin-bottom: 120px; /* 아이템 간 여백 확대 */
            position: relative;
            scroll-snap-align: start; /* 이미지 상단을 스냅 기준선으로 설정 */
            scroll-snap-stop: always;
            scroll-margin-top: 150px; /* sticky top (150px) 위치와 완벽히 맞춤 */
        }

        .image-container { 
            width: 100%;
            aspect-ratio: 1280 / 720;
            overflow: hidden;
            position: relative;
        }
        .image-container img { 
            width: 100%; 
            height: 100%;
            object-fit: cover;
            display: block; 
        }

        /* 오른쪽 텍스트 고정(Sticky) 영역 */
        .content-fixed-section { 
            position: sticky; 
            top: 150px; /* 이미지의 scroll-margin-top과 일치 */
        }

        .content { 
            position: relative; 
            min-height: 400px; 
            padding-bottom: 60px;
            transition: opacity 0.3s ease;
        }
        .content.fade-out {
            opacity: 0;
        }

        .project-link-btn {
            display: inline-block;
            margin-top: 35px;
            padding: 10px 28px;
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: #333;
            text-align: center;
            transition: all 0.3s ease;
        }

        .project-link-btn:hover {
            background-color: #333;
            color: #fff;
        }

        .scroll-arrow { 
            position: absolute; 
            bottom: -10%; 
            left: 50%; 
            transform: translateX(-50%) rotate(45deg);
            width: 20px; 
            height: 20px; 
            border-bottom: 1.5px solid #333; 
            border-right: 1.5px solid #333;
            animation: float 1.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(45deg); }
            50% { transform: translateX(-50%) translateY(-10px) rotate(45deg); }
        }

        .content h3 { font-size: 11px; margin-top: 30px; margin-bottom: 10px; color: #888; text-transform: uppercase; }
        .content p { line-height: 1.6; margin: 0; font-size: 12px; }
        
        #textProject {
            font-size: 30px;
            font-weight: 600;
            line-height: 1; /* 상단 정렬을 유지를 위한 라인 하이트 축소 */
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: #333;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .mobile-project-title {
            display: none;
        }

        /* 모바일 전용 스타일 (768px 이하) */
        @media (max-width: 768px) {
            body {
                padding-top: 100px;
                font-size: 14px;
            }

            .header { 
                display: flex;
                justify-content: space-between;
                align-items: flex-end; 
                padding: 15px 20px 15px 20px; 
                position: fixed;
            }

            .header-left { 
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                flex: 1;
                margin-right: 15px;
                overflow: hidden;
            }

            .logo-area {
                display: block;
                margin: 0;
                padding: 0;
            }

            .logo-text { 
                font-size: 42px; 
                font-weight: 600; 
                letter-spacing: 1px; 
                line-height: 1; 
                display: block;
                margin: 0;
                padding: 0;
            }
            
            .header-left > div:last-child { 
                display: block; 
                width: 100%;
                margin: 24px 0 0 0;
                padding: 0;
                text-align: left;
                overflow: hidden;
            }

            .center-text {
                font-size: clamp(8px, 2.3vw, 11px);
                white-space: nowrap;
                display: block;
                text-align: left;
                letter-spacing: -0.3px;
                line-height: 1.2;
                color: #666;
                margin: 0;
                padding: 0 0 0 2px;
                transform: translateX(-1px);
            }

            .header-right {
                display: flex;
                justify-content: flex-end;
                align-items: flex-end;
                position: static;
                flex-shrink: 0;
            }

            .header-right > div:not(.menu-wrapper) { 
                display: none; 
            }

            .menu-wrapper {
                position: relative;
                top: 0;
                right: 0;
            }

            .menu-btn { 
                width: 26px; 
                height: 20px; 
                padding: 2px;
                margin-bottom: 1px;
            }

            .menu-btn span {
                height: 1.5px;
            }

            .menu-list {
                top: 30px;
                padding: 12px 16px;
                font-size: 14px;
            }

            .menu-list div {
                padding: 8px 0;
            }

            .main-wrapper { 
                grid-template-columns: 1fr; 
                padding: 15px;
                margin-top: 30px;
                gap: 0;
            }

            .image-snap-item {
                margin-bottom: 25px;
                scroll-snap-align: start;
                scroll-margin-top: 120px;
            }

            .image-container {
                aspect-ratio: 4 / 3;
                border-radius: 4px;
            }

            .image-container .mobile-project-title {
                display: block !important;
                position: absolute !important;
                bottom: 15px !important;
                left: 15px !important;
                color: #ffffff !important;
                font-size: 18px !important;
                font-weight: 700 !important;
                letter-spacing: -0.3px !important;
                text-transform: uppercase !important;
                text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6) !important;
                z-index: 2 !important;
                pointer-events: none !important;
            }

            .content-fixed-section { 
                display: none; 
            }

            .content h3 {
                font-size: 12px;
                margin-top: 20px;
                margin-bottom: 6px;
            }

            .content p {
                font-size: 13px;
                line-height: 1.5;
            }
        }
    </style>
</head>
<body>

    <!-- 인트로 오버레이 & 고정 경계선 -->
    <div id="introOverlay"></div>
    <div class="intro-line" id="introLine"></div>

    <header class="header" id="headerNav">
        <a href="index.html" class="header-left">
            <div class="logo-area">
                <span class="logo-text">MOK</span>
            </div>
            <div><span class="center-text">The more we strip away, the more the essence comes into focus</span></div>
        </a>
        <div class="header-right">
            <div><strong>LOCATION</strong><br><span class="sub-text">based in seoul</span></div>
            <div><strong>CONTACT</strong><br><span class="sub-text">wjdwoahr_@naver.com</span></div>
            
            <div class="menu-wrapper" id="menuWrapper">
                <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="menu-list" id="menuList">
                    <div>About</div>
                    <div>Project</div>
                    <div>Contact</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-wrapper">
        <!-- 왼쪽: 이미지 영역 -->
        <div class="image-scroll-section" id="imageScrollSection">
            
            <!-- 프로젝트 1 -->
            <div class="image-snap-item" 
                 data-project="Comfortemple" 
                 data-type="[2023.10] Architecture + Interior" 
                 data-link="project-comfortemple.html"
                 data-desc="자연과 고요한 사찰의 공간 속에서 불교의 비움과 수행의 가치를 현대적으로 경험하며, 일상의 자극과 번잡함에서 벗어나 마음의 평온을 되찾는 스테이 공간.
Within the tranquility of nature and a Buddhist temple, this stay offers a contemporary experience of Buddhist principles of letting go and spiritual practice, allowing guests to step away from the noise and stimulation of everyday life and rediscover a sense of inner peace.">
                <div class="image-container">
                    <picture>
                        <source media="(max-width: 768px)" srcset="1.png">
                        <img src="1.png" alt="Comfortemple Project">
                    </picture>
                    <div class="mobile-project-title" style="font-size: 15px; font-weight: 500;">Comfortemple</div>
                </div>
            </div>

            <!-- 프로젝트 2 -->
            <div class="image-snap-item" 
                 data-project="Second Project Title" 
                 data-type="Interior Design" 
                 data-link="project-second.html"
                 data-desc="Description for the second project goes here. A seamless transition between minimalist architectural forms and warm interior lighting.">
                <div class="image-container">
                    <picture>
                        <source media="(max-width: 768px)" srcset="2.jpg">
                        <img src="2.jpg" alt="Second Project Title">
                    </picture>
                    <div class="mobile-project-title" style="font-size: 15px; font-weight: 500;">Second Project Title</div>
                </div>
            </div>

            <!-- 프로젝트 3 -->
            <div class="image-snap-item" 
                 data-project="Third Project Title" 
                 data-type="Branding + Architecture" 
                 data-link="project-third.html"
                 data-desc="A comprehensive approach combining structural elements with identity design to craft timeless modern spaces.">
                <div class="image-container">
                    <picture>
                        <source media="(max-width: 768px)" srcset="3.jpg">
                        <img src="3.jpg" alt="Third Project Title">
                    </picture>
                    <div class="mobile-project-title" style="font-size: 15px; font-weight: 500;">Third Project Title</div>
                </div>
            </div>

        </div>

        <!-- 오른쪽: 고정 텍스트 영역 (PC용) -->
        <div class="content-fixed-section">
            <div class="content" id="contentBox">
                <p id="textProject"></p>
                <h3>PROJECT TYPE</h3><p id="textType"></p>
                <h3>DESCRIPTION</h3><p id="textDesc"></p>
                
                <!-- 프로젝트 바로가기 버튼 -->
                <div>
                    <a href="#" id="projectLinkBtn" class="project-link-btn">View Project</a>
                </div>

                <div class="scroll-arrow"></div>
            </div>
        </div>
    </main>

    <script>
        function updateLinePosition() {
            const headerNav = document.getElementById("headerNav");
            const introLine = document.getElementById("introLine");
            if (headerNav && introLine) {
                const headerBottom = headerNav.getBoundingClientRect().bottom;
                introLine.style.top = `${headerBottom}px`;
            }
        }

        window.addEventListener("load", () => {
            runIntroSequence();
        });

        const fallbackTimer = setTimeout(() => {
            if (!document.body.classList.contains("loaded")) {
                runIntroSequence();
            }
        }, 2500);

        function runIntroSequence() {
            clearTimeout(fallbackTimer);
            const introOverlay = document.getElementById("introOverlay");

            if (document.body.classList.contains("loaded")) return;

            setTimeout(() => {
                updateLinePosition();

                setTimeout(() => {
                    document.body.classList.add("loaded");
                    introOverlay.style.opacity = "0";

                    setTimeout(() => {
                        introOverlay.style.display = "none";
                    }, 800);
                }, 300);
            }, 1000);
        }

        window.addEventListener("resize", () => {
            updateLinePosition();
            
            // 화면 크기 변경 시 모바일 반응형 처리
            if (window.innerWidth <= 768) {
                stopAutoScroll();
            }
        });

        function toggleMenu() {
            const wrapper = document.getElementById('menuWrapper');
            wrapper.classList.toggle('active');
        }

        // ==========================================
        // 무한 루프 스크롤 & 관측 & 자동 스크롤 로직
        // ==========================================
        let autoScrollTimer = null;

        function stopAutoScroll() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const scrollContainer = document.getElementById("imageScrollSection");
            const contentBox = document.getElementById("contentBox");
            const textProject = document.getElementById("textProject");
            const textType = document.getElementById("textType");
            const textDesc = document.getElementById("textDesc");
            const projectLinkBtn = document.getElementById("projectLinkBtn");

            const initialItems = Array.from(scrollContainer.querySelectorAll(".image-snap-item"));
            let observer = null;
            let currentActiveIndex = 0;
            let userActivityTimeout = null;

            // 프로젝트 정보 업데이트 함수
            function updateContent(target) {
                if (!contentBox) return;
                contentBox.classList.add("fade-out");

                setTimeout(() => {
                    textProject.textContent = target.dataset.project || "";
                    textType.textContent = target.dataset.type || "";

                    const rawDesc = target.dataset.desc || "";
                    textDesc.innerHTML = rawDesc.trim().replace(/\n+/g, '<br><br>');

                    if (projectLinkBtn) {
                        projectLinkBtn.href = target.dataset.link || "#";
                    }

                    contentBox.classList.remove("fade-out");
                }, 150);
            }

            // IntersectionObserver 생성
            function createObserver() {
                const observerOptions = {
                    root: null,
                    rootMargin: "-150px 0px -60% 0px",
                    threshold: 0
                };

                observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            updateContent(entry.target);
                            
                            const items = Array.from(document.querySelectorAll(".image-snap-item"));
                            const index = items.indexOf(entry.target);
                            if (index !== -1) {
                                currentActiveIndex = index;
                            }
                        }
                    });
                }, observerOptions);

                document.querySelectorAll(".image-snap-item").forEach((item) => observer.observe(item));
            }

            // 다음 프로젝트로 이동
            function scrollToNextProject() {
                const items = document.querySelectorAll(".image-snap-item");
                const nextIndex = currentActiveIndex + 1;

                if (nextIndex < items.length) {
                    const nextItem = items[nextIndex];
                    const isMobile = window.innerWidth <= 768;
                    const scrollMargin = isMobile ? 120 : 150;
                    
                    const targetPosition = nextItem.getBoundingClientRect().top + window.scrollY - scrollMargin;

                    window.scrollTo({
                        top: targetPosition,
                        behavior: "smooth"
                    });
                }
            }

            // 자동 스크롤 시작 (모바일에선 동작 방지)
            function startAutoScroll() {
                stopAutoScroll();
                
                // 모바일 환경(768px 이하)일 경우 자동 스크롤을 실행하지 않음
                if (window.innerWidth <= 768) return;

                autoScrollTimer = setInterval(scrollToNextProject, 4000);
            }

            // 사용자 조작 발생 시: 일시 정지 후 3초 뒤 자동 스크롤 재개 (PC 환경 전용)
            function handleUserInteraction() {
                stopAutoScroll();

                if (window.innerWidth <= 768) return;

                if (userActivityTimeout) {
                    clearTimeout(userActivityTimeout);
                }

                userActivityTimeout = setTimeout(() => {
                    startAutoScroll();
                }, 3000);
            }

            // 무한 스크롤 생성
            function setupInfiniteScroll() {
                for (let i = 0; i < 2; i++) {
                    initialItems.forEach((item) => {
                        const clone = item.cloneNode(true);
                        scrollContainer.appendChild(clone);
                    });
                }

                createObserver();

                window.addEventListener("scroll", () => {
                    const scrollHeight = document.documentElement.scrollHeight;
                    const scrollTop = window.scrollY || document.documentElement.scrollTop;
                    const clientHeight = document.documentElement.clientHeight;

                    if (scrollTop + clientHeight >= scrollHeight - 800) {
                        initialItems.forEach((item) => {
                            const clone = item.cloneNode(true);
                            scrollContainer.appendChild(clone);
                            if (observer) observer.observe(clone);
                        });
                    }
                });
            }

            // 사용자 스크롤/터치/휠 이벤트 바인딩
            function setupUserInteractionEvents() {
                const interactionEvents = ["wheel", "touchmove", "keydown", "mousedown"];

                interactionEvents.forEach(evt => {
                    window.addEventListener(evt, handleUserInteraction, { passive: true });
                });
            }

            setupInfiniteScroll();
            setupUserInteractionEvents();
            startAutoScroll();
        });
    </script>
</body>
</html>
