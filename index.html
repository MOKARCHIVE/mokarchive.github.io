<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        /* 1. HTML / BODY 스크롤 스냅 설정 */
        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        body { 
            margin: 0; 
            padding: 0; 
            padding-top: 100px; 
            background-color: #ffffff; 
            font-family: 'Pretendard', sans-serif; 
            font-size: 12px; 
            color: #333; 
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* 인트로 배경 오버레이 */
        #introOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9998;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        /* 인트로 그라데이션 선 */
        .intro-line {
            position: fixed;
            top: 50vh;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(
                to right, 
                rgba(160, 160, 160, 0) 0%, 
                rgba(160, 160, 160, 0.5) 2%, 
                rgba(100, 100, 100, 1) 15%, 
                rgba(100, 100, 100, 1) 85%, 
                rgba(160, 160, 160, 0.5) 98%, 
                rgba(160, 160, 160, 0) 100%
            );
            transform: scaleX(0);
            transform-origin: center;
            z-index: 10001;
            animation: expandLine 1.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transition: top 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: none;
        }

        @keyframes expandLine {
            0% { transform: scaleX(0); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: scaleX(1); opacity: 1; }
        }

        /* 본문 및 헤더 요소 초기 숨김 */
        .header, .main-wrapper {
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        body.loaded .header, 
        body.loaded .main-wrapper {
            opacity: 1;
        }

        body.loaded {
            overflow-y: auto;
        }

        a { text-decoration: none; color: inherit; display: block; }

        /* 헤더 레이아웃 */
        .header { 
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
            align-items: center; 
            padding: 15px 60px 20px 60px; 
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%;
            background-color: #ffffff; 
            z-index: 1000; 
            font-weight: 500;
            box-sizing: border-box;
        }

        .header-left { 
            display: flex; 
            align-items: center; 
        }

        .logo-area { display: flex; align-items: center; }
        .logo-text { font-size: 60px; font-weight: 600; letter-spacing: 1px; line-height: 1; }

        /* 데스크톱 네비게이션 */
        .header-right { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            width: 100%;
        }

        .nav-item {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: opacity 0.2s ease;
            text-transform: uppercase;
        }

        .nav-item:hover {
            opacity: 0.5;
        }

        /* 모바일 햄버거 버튼 */
        .hamburger-btn {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 16px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1001;
            justify-self: end;
        }

        .hamburger-btn span {
            display: block;
            width: 100%;
            height: 1.5px;
            background-color: #333;
            transition: all 0.3s ease;
        }

        .hamburger-btn.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        .hamburger-btn.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-btn.active span:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        /* 전체 레이아웃 */
        .main-wrapper { 
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
            align-items: start;
            padding: 0 60px 20px 60px; 
            margin-top: 30px;
            box-sizing: border-box;
        }

        /* 왼쪽 이미지 스크롤 영역 */
        .image-scroll-section {
            display: flex;
            flex-direction: column;
        }

        .image-snap-item {
            margin-bottom: 40px;
            position: relative;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            scroll-margin-top: 130px;
        }

        /* 이미지 비율 16:9 */
        .image-container { 
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: unset;
            overflow: hidden;
            position: relative;
        }
        .image-container img { 
            width: 100%; 
            height: 100%;
            object-fit: cover;
            display: block; 
        }

        /* 오른쪽 텍스트 고정(Sticky) 영역 */
        .content-fixed-section { 
            position: sticky; 
            top: 130px;
            padding-left: 0;
        }

        .content { 
            position: relative; 
            min-height: 400px; 
            padding-bottom: 60px;
            transition: opacity 0.3s ease;
        }
        .content.fade-out {
            opacity: 0;
        }

        /* View Project 버튼 수정: 기본 #333 배경 설정 */
        .project-link-btn {
            display: inline-block;
            margin-top: 35px;
            padding: 10px 28px;
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 0.5px;
            background-color: #333;
            color: #ffffff;
            text-align: center;
            transition: all 0.3s ease;
        }

        .project-link-btn:hover {
            background-color: #555555;
            border-color: #555555;
            color: #ffffff;
        }

        .scroll-arrow { 
            position: absolute; 
            bottom: -10%; 
            left: 50%; 
            transform: translateX(-50%) rotate(45deg);
            width: 20px; 
            height: 20px; 
            border-bottom: 1.5px solid #333; 
            border-right: 1.5px solid #333;
            animation: float 1.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(45deg); }
            50% { transform: translateX(-50%) translateY(-10px) rotate(45deg); }
        }

        .content h3 { font-size: 11px; margin-top: 30px; margin-bottom: 10px; color: #888; text-transform: uppercase; }
        .content p { line-height: 1.6; margin: 0; font-size: 12px; }
        
        #textProject {
            font-size: 36px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: #333;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .mobile-project-title {
            display: none;
        }

        /* 모바일 반응형 (768px 이하) */
        @media (max-width: 768px) {
            html {
                scroll-snap-type: y proximity;
            }

            body {
                padding-top: 70px;
                font-size: 14px;
            }

            .intro-line {
                left: 15px;
                right: 15px;
                height: 0.8px;
            }

            .header { 
                display: flex;
                justify-content: space-between;
                padding: 15px 20px; 
            }

            .logo-text { 
                font-size: 28px; 
            }

            .hamburger-btn {
                display: flex;
            }

            .header-right {
                position: fixed;
                top: 60px;
                left: 0;
                width: 100%;
                background-color: #ffffff;
                flex-direction: column;
                align-items: flex-start;
                padding: 20px 25px 30px 25px;
                gap: 18px;
                box-sizing: border-box;
                border-bottom: 1px solid #eee;
                transform: translateY(-150%);
                opacity: 0;
                visibility: hidden;
                transition: all 0.35s ease-in-out;
                z-index: 999;
            }

            .header-right.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }

            .nav-item {
                font-size: 13px;
                font-weight: 500;
                width: 100%;
            }

            .main-wrapper { 
                grid-template-columns: 1fr; 
                padding: 15px;
                margin-top: 10px;
                gap: 0;
            }

            .image-snap-item {
                margin-bottom: 30px;
                scroll-snap-align: start;
                scroll-margin-top: 80px;
            }

            .image-container {
                aspect-ratio: 16 / 9;
                min-height: unset;
                border-radius: 4px;
            }

            .image-container .mobile-project-title {
                display: block !important;
                position: absolute !important;
                bottom: 15px !important;
                left: 15px !important;
                color: #ffffff !important;
                font-size: 18px !important;
                font-weight: 700 !important;
                letter-spacing: -0.3px !important;
                text-transform: uppercase !important;
                text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6) !important;
                z-index: 2 !important;
                pointer-events: none !important;
            }

            .content-fixed-section { 
                display: none; 
            }
        }
    </style>
</head>
<body>

    <!-- 인트로 오버레이 & 고정 경계선 -->
    <div id="introOverlay"></div>
    <div class="intro-line" id="introLine"></div>

    <header class="header" id="headerNav">
        <a href="index.html" class="header-left">
            <div class="logo-area">
                <span class="logo-text">MOK</span>
            </div>
        </a>
        
        <!-- 우측 메뉴 버튼 -->
        <nav class="header-right" id="navMenu">
            <a href="about.html" class="nav-item">ABOUT</a>
            <a href="project.html" class="nav-item">PROJECT</a>
            <a href="instagram.html" class="nav-item">INSTAGRAM</a>
            <a href="behance.html" class="nav-item">BEHANCE</a>
            <a href="youtube.html" class="nav-item">YOUTUBE</a>
            <a href="contact.html" class="nav-item">CONTACT</a>
        </nav>

        <!-- 햄버거 토글 버튼 (모바일 전용) -->
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="메뉴 열기">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <main class="main-wrapper">
        <!-- 왼쪽: 이미지 영역 -->
        <div class="image-scroll-section" id="imageScrollSection">
            
            <!-- 프로젝트 1 -->
            <div class="image-snap-item" 
                 data-project="Comfortemple" 
                 data-type="[2023.10] Architecture + Interior" 
                 data-link="project-comfortemple.html"
                 data-desc="자연과 고요한 사찰의 공간 속에서 불교의 비움과 수행의 가치를 현대적으로 경험하며, 일상의 자극과 번잡함에서 벗어나 마음의 평온을 되찾는 스테이 공간.
a contemporary retreat inspired by Buddhist principles of letting go, where nature and stillness create a space for reflection and inner peace.">
                <div class="image-container">
                    <picture>
                        <source media="(max-width: 768px)" srcset="1.png">
                        <img src="1.png" alt="Comfortemple Project">
                    </picture>
                    <div class="mobile-project-title" style="font-size: 15px; font-weight: 500;">Comfortemple</div>
                </div>
            </div>

            <!-- 프로젝트 2 -->
            <div class="image-snap-item" 
                 data-project="Second Project Title" 
                 data-type="[2026.05] Interior" 
                 data-link="project-second.html"
                 data-desc="자연과 고요한 사찰의 공간 속에서 불교의 비움과 수행의 가치를 현대적으로 경험하며, 일상의 자극과 번잡함에서 벗어나 마음의 평온을 되찾는 스테이 공간.
Description for the second project goes here. A seamless transition between minimalist architectural forms and warm interior lighting.">
                <div class="image-container">
                    <picture>
                        <source media="(max-width: 768px)" srcset="2.jpg">
                        <img src="2.jpg" alt="Second Project Title">
                    </picture>
                    <div class="mobile-project-title" style="font-size: 15px; font-weight: 500;">Second Project Title</div>
                </div>
            </div>

            <!-- 프로젝트 3 -->
            <div class="image-snap-item" 
                 data-project="Third Project Title" 
                 data-type="[2026.07] Interior" 
                 data-link="project-third.html"
                 data-desc="자연과 고요한 사찰의 공간 속에서 불교의 비움과 수행의 가치를 현대적으로 경험하며, 일상의 자극과 번잡함에서 벗어나 마음의 평온을 되찾는 스테이 공간.
A comprehensive approach combining structural elements with identity design to craft timeless modern spaces.">
                <div class="image-container">
                    <picture>
                        <source media="(max-width: 768px)" srcset="3.jpg">
                        <img src="3.jpg" alt="Third Project Title">
                    </picture>
                    <div class="mobile-project-title" style="font-size: 15px; font-weight: 500;">Third Project Title</div>
                </div>
            </div>

        </div>

        <!-- 오른쪽: 고정 텍스트 영역 (PC용) -->
        <div class="content-fixed-section">
            <div class="content" id="contentBox">
                <p id="textProject"></p>
                <h3>PROJECT TYPE</h3><p id="textType"></p>
                <h3>DESCRIPTION</h3><p id="textDesc"></p>
                
                <div>
                    <a href="#" id="projectLinkBtn" class="project-link-btn">View Project</a>
                </div>

                <div class="scroll-arrow"></div>
            </div>
        </div>
    </main>

    <script>
        function updateLinePosition() {
            const headerNav = document.getElementById("headerNav");
            const introLine = document.getElementById("introLine");
            if (headerNav && introLine) {
                const headerBottom = headerNav.getBoundingClientRect().bottom;
                introLine.style.top = `${headerBottom}px`;
            }
        }

        window.addEventListener("load", () => {
            runIntroSequence();
        });

        const fallbackTimer = setTimeout(() => {
            if (!document.body.classList.contains("loaded")) {
                runIntroSequence();
            }
        }, 2500);

        function runIntroSequence() {
            clearTimeout(fallbackTimer);
            const introOverlay = document.getElementById("introOverlay");

            if (document.body.classList.contains("loaded")) return;

            setTimeout(() => {
                updateLinePosition();

                setTimeout(() => {
                    document.body.classList.add("loaded");
                    introOverlay.style.opacity = "0";

                    setTimeout(() => {
                        introOverlay.style.display = "none";
                    }, 800);
                }, 300);
            }, 1000);
        }

        /* 모바일 햄버거 메뉴 토글 로직 */
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const navMenu = document.getElementById("navMenu");

        hamburgerBtn.addEventListener("click", () => {
            hamburgerBtn.classList.toggle("active");
            navMenu.classList.toggle("active");
        });

        /* 모바일 메뉴 항목 클릭 시 메뉴 닫기 */
        document.querySelectorAll(".nav-item").forEach(item => {
            item.addEventListener("click", () => {
                hamburgerBtn.classList.remove("active");
                navMenu.classList.remove("active");
            });
        });

        window.addEventListener("resize", () => {
            updateLinePosition();
            
            if (window.innerWidth <= 768) {
                stopAutoScroll();
            } else {
                hamburgerBtn.classList.remove("active");
                navMenu.classList.remove("active");
            }
        });

        /* ==========================================
           무한 루프 스크롤 & 관측 & 자동 스크롤 로직
           ========================================== */
        let autoScrollTimer = null;

        function stopAutoScroll() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const scrollContainer = document.getElementById("imageScrollSection");
            const contentBox = document.getElementById("contentBox");
            const textProject = document.getElementById("textProject");
            const textType = document.getElementById("textType");
            const textDesc = document.getElementById("textDesc");
            const projectLinkBtn = document.getElementById("projectLinkBtn");

            const initialItems = Array.from(scrollContainer.querySelectorAll(".image-snap-item"));
            let observer = null;
            let currentActiveIndex = 0;
            let userActivityTimeout = null;

            function updateContent(target) {
                if (!contentBox) return;
                contentBox.classList.add("fade-out");

                setTimeout(() => {
                    textProject.textContent = target.dataset.project || "";
                    textType.textContent = target.dataset.type || "";

                    const rawDesc = target.dataset.desc || "";
                    textDesc.innerHTML = rawDesc.trim().replace(/\n+/g, '<br><br>');

                    if (projectLinkBtn) {
                        projectLinkBtn.href = target.dataset.link || "#";
                    }

                    contentBox.classList.remove("fade-out");
                }, 150);
            }

            function createObserver() {
                const observerOptions = {
                    root: null,
                    rootMargin: "-130px 0px -60% 0px",
                    threshold: 0
                };

                observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            updateContent(entry.target);
                            
                            const items = Array.from(document.querySelectorAll(".image-snap-item"));
                            const index = items.indexOf(entry.target);
                            if (index !== -1) {
                                currentActiveIndex = index;
                            }
                        }
                    });
                }, observerOptions);

                document.querySelectorAll(".image-snap-item").forEach((item) => observer.observe(item));
            }

            function scrollToNextProject() {
                const items = document.querySelectorAll(".image-snap-item");
                const nextIndex = currentActiveIndex + 1;

                if (nextIndex < items.length) {
                    const nextItem = items[nextIndex];
                    const isMobile = window.innerWidth <= 768;
                    const scrollMargin = isMobile ? 80 : 130;
                    
                    const targetPosition = nextItem.getBoundingClientRect().top + window.scrollY - scrollMargin;

                    window.scrollTo({
                        top: targetPosition,
                        behavior: "smooth"
                    });
                }
            }

            function startAutoScroll() {
                stopAutoScroll();
                if (window.innerWidth <= 768) return;

                autoScrollTimer = setInterval(scrollToNextProject, 4000);
            }

            function handleUserInteraction() {
                stopAutoScroll();

                if (window.innerWidth <= 768) return;

                if (userActivityTimeout) {
                    clearTimeout(userActivityTimeout);
                }

                userActivityTimeout = setTimeout(() => {
                    startAutoScroll();
                }, 3000);
            }

            function setupInfiniteScroll() {
                for (let i = 0; i < 2; i++) {
                    initialItems.forEach((item) => {
                        const clone = item.cloneNode(true);
                        scrollContainer.appendChild(clone);
                    });
                }

                createObserver();

                window.addEventListener("scroll", () => {
                    const scrollHeight = document.documentElement.scrollHeight;
                    const scrollTop = window.scrollY || document.documentElement.scrollTop;
                    const clientHeight = document.documentElement.clientHeight;

                    if (scrollTop + clientHeight >= scrollHeight - 800) {
                        initialItems.forEach((item) => {
                            const clone = item.cloneNode(true);
                            scrollContainer.appendChild(clone);
                            if (observer) observer.observe(clone);
                        });
                    }
                });
            }

            function setupUserInteractionEvents() {
                const interactionEvents = ["wheel", "touchmove", "keydown", "mousedown"];

                interactionEvents.forEach(evt => {
                    window.addEventListener(evt, handleUserInteraction, { passive: true });
                });
            }

            setupInfiniteScroll();
            setupUserInteractionEvents();
            startAutoScroll();
        });
    </script>
</body>
</html>
