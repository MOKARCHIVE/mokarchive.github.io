<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        /* 스크롤 스냅 설정 */
        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        body { 
            margin: 0; 
            padding: 0; 
            padding-top: 100px; 
            background-color: #ffffff; 
            font-family: 'Pretendard', sans-serif; 
            font-size: 12px; 
            color: #333; 
        }
        a { text-decoration: none; color: inherit; display: block; }

        .header { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 35px; 
            padding: 20px 60px 25px 60px; 
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%;
            background-color: #ffffff; 
            z-index: 1000; 
            font-weight: 500;
            box-sizing: border-box;
            border-bottom: none; 
            align-items: center; 
        }

        /* 헤더 하단 그라데이션 경계선 (PC 기본) */
        .header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(
                to right, 
                rgba(160, 160, 160, 0) 0%, 
                rgba(160, 160, 160, 0.5) 2%, 
                rgba(100, 100, 100, 1) 15%, 
                rgba(100, 100, 100, 1) 85%, 
                rgba(160, 160, 160, 0.5) 98%, 
                rgba(160, 160, 160, 0) 100%
            );
        }
        
        .sub-text { font-weight: 300; } 
        
        .header-left { 
            display: grid; 
            grid-template-columns: auto 1fr; 
            align-items: center; 
        }
        .header-left > div:last-child {
            justify-self: center;
        }

        .header-right { display: grid; grid-template-columns: 1fr 1fr; align-items: start; position: relative; }

        .center-text {
            font-size: 12px;
            font-weight: 300;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .logo-area { display: flex; align-items: center; }
        .logo-text { font-size: 42px; font-weight: 600; letter-spacing: 1px; line-height: 1; }

        /* 메뉴 Wrapper */
        .menu-wrapper {
            position: absolute;
            right: 0px;
            top: 2.5px;
            z-index: 1000;
        }

        .menu-btn { 
            width: 25px; 
            height: 22px; 
            cursor: pointer; 
            margin-left: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px;
            box-sizing: border-box;
            transition: transform 0.3s ease; 
        }

        .menu-btn span {
            display: block;
            width: 100%;
            height: 1.5px;
            background-color: #000;
            transition: background-color 0.3s ease;
        }

        .menu-list { 
            display: block; 
            position: absolute; 
            top: 30px; 
            right: 0; 
            background: #ffffff; 
            border: 1px solid #333; 
            padding: 10px; 
            text-align: right; 
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .menu-wrapper:hover .menu-list,
        .menu-wrapper.active .menu-list { 
            opacity: 1;
            visibility: visible;
        }

        .menu-list div { padding: 5px 0; cursor: pointer; }
        .menu-list div:hover { text-decoration: underline; }

        /* 전체 레이아웃 (좌: 이미지 스크롤, 우: 고정 텍스트) */
        .main-wrapper { 
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
            padding: 0 60px 20px 60px; 
            margin-top: 50px;
            box-sizing: border-box;
        }

        /* 왼쪽 이미지 스크롤 영역 */
        .image-scroll-section {
            display: flex;
            flex-direction: column;
        }

        .image-scroll-section::after {
            content: "";
            display: block;
            height: calc(100vh - 300px);
        }

        /* 이미지 스냅 아이템 */
        .image-snap-item {
            scroll-snap-align: start;
            scroll-margin-top: 150px;
            margin-bottom: 80px;
            position: relative;
        }

        .image-container { 
            width: 100%;
            aspect-ratio: 1280 / 720;
            overflow: hidden;
            position: relative;
        }
        .image-container img { 
            width: 100%; 
            height: 100%;
            object-fit: cover;
            display: block; 
        }

        /* 오른쪽 텍스트 고정(Sticky) 영역 및 애니메이션 효과 */
        .content-fixed-section { 
            position: sticky; 
            top: 150px; 
        }

        .content { 
            position: relative; 
            min-height: 400px; 
            padding-bottom: 60px;
            transition: opacity 0.3s ease;
        }
        .content.fade-out {
            opacity: 0;
        }

        .scroll-arrow { 
            position: absolute; 
            bottom: -10%; 
            left: 50%; 
            transform: translateX(-50%);
            width: 42px; 
            height: 42px; 
            border: 1.5px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            animation: float 1.5s ease-in-out infinite;
        }

        .scroll-arrow::after {
            content: "";
            width: 12px;
            height: 12px;
            border-bottom: 2px solid #333;
            border-right: 2px solid #333;
            transform: rotate(45deg);
            margin-top: -4px;
        }

        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        .content h3 { font-size: 11px; margin-top: 30px; margin-bottom: 10px; color: #888; text-transform: uppercase; }
        .content p { line-height: 1.6; margin: 0; font-size: 12px; }
        
        #textProject {
            font-size: 30px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: #333;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .mobile-project-title {
            display: none;
        }

        /* ==========================================
           모바일 전용 스타일 (768px 이하)
           ========================================== */
        @media (max-width: 768px) {
            body {
                padding-top: 100px;
                font-size: 14px;
            }

            .header { 
                display: flex;
                justify-content: space-between;
                align-items: flex-end; 
                padding: 15px 20px 15px 20px; 
                position: fixed;
            }

            .header::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 15px;
                right: 15px;
                height: 0.8px;
                background: linear-gradient(
                    to right, 
                    rgba(160, 160, 160, 0) 0%, 
                    rgba(160, 160, 160, 0.5) 2%, 
                    rgba(100, 100, 100, 1) 15%, 
                    rgba(100, 100, 100, 1) 85%, 
                    rgba(160, 160, 160, 0.5) 98%, 
                    rgba(160, 160, 160, 0) 100%
                );
            }

            .header-left { 
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                flex: 1;
                margin-right: 15px;
                overflow: hidden;
            }

            .logo-area {
                display: block;
                margin: 0;
                padding: 0;
            }

            .logo-text { 
                font-size: 42px; 
                font-weight: 600; 
                letter-spacing: 1px; 
                line-height: 1; 
                display: block;
                margin: 0;
                padding: 0;
            }
            
            .header-left > div:last-child { 
                display: block; 
                width: 100%;
                margin: 24px 0 0 0;
                padding: 0;
                text-align: left;
                overflow: hidden;
            }

            .center-text {
                font-size: clamp(8px, 2.3vw, 11px);
                white-space: nowrap;
                display: block;
                text-align: left;
                letter-spacing: -0.3px;
                line-height: 1.2;
                color: #666;
                margin: 0;
                padding: 0 0 0 2px;
                transform: translateX(-1px);
            }

            .header-right {
                display: flex;
                justify-content: flex-end;
                align-items: flex-end;
                position: static;
                flex-shrink: 0;
            }

            .header-right > div:not(.menu-wrapper) { 
                display: none; 
            }

            .menu-wrapper {
                position: relative;
                top: 0;
                right: 0;
            }

            .menu-btn { 
                width: 26px; 
                height: 20px; 
                padding: 2px;
                margin-bottom: 1px;
            }

            .menu-btn span {
                height: 1.5px;
            }

            .menu-list {
                top: 30px;
                padding: 12px 16px;
                font-size: 14px;
            }

            .menu-list div {
                padding: 8px 0;
            }

            .main-wrapper { 
                grid-template-columns: 1fr; 
                padding: 15px;
                margin-top: 30px;
                gap: 0;
            }

            .image-scroll-section::after {
                display: none;
            }

            .image-snap-item {
                scroll-margin-top: 130px;
                margin-bottom: 25px;
            }

            .image-container {
                aspect-ratio: 4 / 3;
                border-radius: 4px;
            }

            /* [수정 포인트 1] 강제 적용을 위한 CSS 선택자 우선순위 강화 */
            .image-container .mobile-project-title {
                display: block !important;
                position: absolute !important;
                bottom: 15px !important;
                left: 15px !important;
                color: #ffffff !important;
                
                /* ===================================================
                   글자 크기 & 굵기 조절 (원하는 수치로 변경하세요)
                   =================================================== */
                font-size: 18px !important;    /* 예: 14px, 15px, 16px */
                font-weight: 600 !important;  /* 예: 400(보통), 500(중간), 600(얇은 굵음) */
                /* =================================================== */
                
                letter-spacing: -0.3px !important;
                text-transform: uppercase !important;
                text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6) !important;
                z-index: 2 !important;
                pointer-events: none !important;
            }

            .content-fixed-section { 
                display: none; 
            }

            .content h3 {
                font-size: 12px;
                margin-top: 20px;
                margin-bottom: 6px;
            }

            .content p {
                font-size: 13px;
                line-height: 1.5;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="header-left">
            <div class="logo-area">
                <span class="logo-text">MOK</span>
            </div>
            <div><span class="center-text">The more we strip away, the more the essence comes into focus</span></div>
        </a>
        <div class="header-right">
            <div><strong>LOCATION</strong><br><span class="sub-text">based in seoul</span></div>
            <div><strong>CONTACT</strong><br><span class="sub-text">wjdwoahr_@naver.com</span></div>
            
            <div class="menu-wrapper" id="menuWrapper">
                <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="menu-list" id="menuList">
                    <div>About</div>
                    <div>Project</div>
                    <div>Contact</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-wrapper">
        <!-- 왼쪽: 이미지 영역 -->
        <div class="image-scroll-section">
            
            <!-- 프로젝트 1 -->
            <div class="image-snap-item" 
                 data-project="Comfortemple" 
                 data-type="Architecture + Interior" 
                 data-desc="자연과 고요한 사찰의 공간 속에서 불교의 비움과 수행의 가치를 현대적으로 경험하며, 일상의 자극과 번잡함에서 벗어나 마음의 평온을 되찾는 스테이 공간.
Within the tranquility of nature and a Buddhist temple, this stay offers a contemporary experience of Buddhist principles of letting go and spiritual practice, allowing guests to step away from the noise and stimulation of everyday life and rediscover a sense of inner peace.">
                <div class="image-container">
                    <picture>
                        <source media="(max-width: 768px)" srcset="1.png">
                        <img src="1.png" alt="Comfortemple Project">
                    </picture>
                    <!-- [수정 포인트 2] 인라인 스타일로 폰트 크기(font-size)와 굵기(font-weight) 직접 조절 가능 -->
                    <div class="mobile-project-title" style="font-size: 15px; font-weight: 500;">Comfortemple</div>
                </div>
            </div>

            <!-- 프로젝트 2 -->
            <div class="image-snap-item" 
                 data-project="Second Project Title" 
                 data-type="Interior Design" 
                 data-desc="Description for the second project goes here. A seamless transition between minimalist architectural forms and warm interior lighting.">
                <div class="image-container">
                    <picture>
                        <source media="(max-width: 768px)" srcset="2.jpg">
                        <img src="2.jpg" alt="Second Project Title">
                    </picture>
                    <div class="mobile-project-title" style="font-size: 15px; font-weight: 500;">Second Project Title</div>
                </div>
            </div>

            <!-- 프로젝트 3 -->
            <div class="image-snap-item" 
                 data-project="Third Project Title" 
                 data-type="Branding + Architecture" 
                 data-desc="A comprehensive approach combining structural elements with identity design to craft timeless modern spaces.">
                <div class="image-container">
                    <picture>
                        <source media="(max-width: 768px)" srcset="your-mobile-image3.jpg">
                        <img src="your-pc-image3.jpg" alt="Third Project Title">
                    </picture>
                    <div class="mobile-project-title" style="font-size: 15px; font-weight: 500;">Third Project Title</div>
                </div>
            </div>

        </div>

        <!-- 오른쪽: 고정 텍스트 영역 (PC용) -->
        <div class="content-fixed-section">
            <div class="content" id="contentBox">
                <p id="textProject"></p>
                <h3>PROJECT TYPE</h3><p id="textType"></p>
                <h3>DESCRIPTION</h3><p id="textDesc"></p>
                <div class="scroll-arrow"></div>
            </div>
        </div>
    </main>

    <script>
        function toggleMenu() {
            const wrapper = document.getElementById('menuWrapper');
            wrapper.classList.toggle('active');
        }

        document.addEventListener("DOMContentLoaded", () => {
            const items = document.querySelectorAll(".image-snap-item");
            const contentBox = document.getElementById("contentBox");
            const textProject = document.getElementById("textProject");
            const textType = document.getElementById("textType");
            const textDesc = document.getElementById("textDesc");

            const observerOptions = {
                root: null,
                rootMargin: "-20% 0px -50% 0px",
                threshold: 0.2
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        const target = entry.target;
                        
                        if (contentBox) {
                            contentBox.classList.add("fade-out");

                            setTimeout(() => {
                                textProject.textContent = target.dataset.project || "";
                                textType.textContent = target.dataset.type || "";
                                
                                const rawDesc = target.dataset.desc || "";
                                textDesc.innerHTML = rawDesc.trim().replace(/\n+/g, '<br><br>');

                                contentBox.classList.remove("fade-out");
                            }, 150);
                        }
                    }
                });
            }, observerOptions);

            items.forEach((item) => observer.observe(item));
        });
    </script>
</body>
</html>
